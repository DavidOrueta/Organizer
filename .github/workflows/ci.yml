name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_sqlite
          coverage: none
      - run: composer install --working-dir=api --no-interaction --prefer-dist
      - run: cp api/.env.example api/.env
      - run: php artisan key:generate --force
        working-directory: api
      - run: php artisan test
        working-directory: api
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          DB_URL: ''